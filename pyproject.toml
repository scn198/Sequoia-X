[project]
name = "sequoia-x"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.10",
    "baostock>=0.9",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-mock>=3.12",
]

# 显式声明包列表：否则 setuptools 的 flat-layout 自动发现会把运行时生成的
# data/ 目录当成第二个顶层包，导致 "Multiple top-level packages discovered" 而安装失败。
[tool.setuptools]
packages = [
    "sequoia_x",
    "sequoia_x.core",
    "sequoia_x.data",
    "sequoia_x.notify",
    "sequoia_x.strategy",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
